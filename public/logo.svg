<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cap-blue" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#28328F"/>
      <stop offset="0.55" stop-color="#1149B4"/>
      <stop offset="1" stop-color="#0A66D6"/>
    </linearGradient>
    <linearGradient id="cap-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8A46"/>
      <stop offset="1" stop-color="#135A2D"/>
    </linearGradient>
    <linearGradient id="cap-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the Relief Medical capsule mark (from the printed card) -->
  <g>
    <!-- capsule body: white left half, silver rim -->
    <rect x="36" y="161" width="440" height="190" rx="95" fill="#FFFFFF" stroke="#AFB9C6" stroke-width="5"/>
    <!-- blue right half with rounded right cap -->
    <path d="M256 163.5 h125 a92.5 92.5 0 0 1 0 185 h-125 Z" fill="url(#cap-blue)"/>
    <!-- green cross centred in the white half -->
    <rect x="127" y="187" width="42" height="138" rx="7" fill="url(#cap-green)"/>
    <rect x="79" y="235" width="138" height="42" rx="7" fill="url(#cap-green)"/>
    <!-- soft top shine across the capsule -->
    <path d="M52 226 c0 -36 26 -60 72 -60 h264 c46 0 72 24 72 60 v6 H52 Z" fill="url(#cap-shine)" opacity="0.55"/>
  </g>
</svg>
